name: Update AWS IP Ranges

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  update-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Даем разрешение на запись
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}   # Явно передаем токен

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run AWS IP fetcher script
      run: |
        python update_aws_ips.py
        
    - name: Commit and push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add aws.txt
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update AWS IP ranges [automated]"
          git push
        fi
